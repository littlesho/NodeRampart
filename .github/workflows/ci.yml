name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    uses: ./.github/workflows/safety.yml

  test:
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      build_date: ${{ steps.metadata.outputs.build_date }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read verified source metadata once
        id: metadata
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: ./scripts/release-metadata.sh >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: true

      - name: Required candidate validation
        run: ./scripts/validate.sh

  build:
    needs: [test, safety]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: true

      - name: Build static Linux binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          COMMIT: ${{ needs.test.outputs.commit }}
          BUILD_DATE: ${{ needs.test.outputs.build_date }}
        run: |
          mkdir -p "dist/linux-${GOARCH}"
          VERSION=$(tr -d '\n' < VERSION)
          LDFLAGS="-s -w -X github.com/littlesho/NodeRampart/internal/version.Version=${VERSION} -X github.com/littlesho/NodeRampart/internal/version.Commit=${COMMIT} -X github.com/littlesho/NodeRampart/internal/version.BuildDate=${BUILD_DATE}"
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "dist/linux-${GOARCH}/noderampart" ./cmd/noderampart
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "dist/linux-${GOARCH}/noderampartd" ./cmd/noderampartd
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "dist/linux-${GOARCH}/noderampart-sensor" ./cmd/noderampart-sensor
          sha256sum "dist/linux-${GOARCH}"/* > "dist/linux-${GOARCH}/SHA256SUMS"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noderampart-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}
          if-no-files-found: error

  deb-package:
    needs: [test, safety]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: true

      - name: Build Debian package
        env:
          COMMIT: ${{ needs.test.outputs.commit }}
          BUILD_DATE: ${{ needs.test.outputs.build_date }}
        run: |
          make build
          ./scripts/build-deb.sh
          dpkg-deb --info dist/*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noderampart-debian-amd64
          path: dist/*.deb
          if-no-files-found: error

  rpm-package:
    needs: [test, safety]
    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    timeout-minutes: 25
    steps:
      - name: Install native Fedora build tools
        run: dnf install -y git golang rpm-build systemd-rpm-macros make python3 tar gzip diffutils findutils
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build through the actual release RPM entry point
        env:
          GOTOOLCHAIN: local
          COMMIT: ${{ needs.test.outputs.commit }}
          BUILD_DATE: ${{ needs.test.outputs.build_date }}
          RELEASE_ARCH: ${{ matrix.arch }}
          GIT_TEST_ASSUME_DIFFERENT_OWNER: "1"
        run: |
          go mod download
          go mod verify
          ./scripts/build-release.sh --rpm "$RELEASE_ARCH"
          python3 scripts/test-packaging.py
          rpm -qp --requires dist/rpm/noderampart-*.rpm
      - name: Upload RPM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noderampart-fedora${{ matrix.fedora }}-${{ matrix.arch }}-rpm
          path: dist/rpm/*.rpm
          if-no-files-found: error
