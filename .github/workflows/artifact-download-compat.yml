name: Artifact download compatibility

# Exercise the two production download input shapes with synthetic artifacts.
# This workflow does not build, collect, attest or publish release packages.
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/artifact-download-compat.yml
      - scripts/check-artifact-download.py

permissions:
  contents: read

concurrency:
  group: artifact-download-compat-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the production download inputs
        run: python3 scripts/check-artifact-download.py check-source
      - name: Create deterministic package and nonmatching fixtures
        run: python3 scripts/check-artifact-download.py create-packages "$RUNNER_TEMP/artifact-fixtures"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-deb-amd64
          path: ${{ runner.temp }}/artifact-fixtures/release-deb-amd64/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rpm-fc44-amd64
          path: ${{ runner.temp }}/artifact-fixtures/release-rpm-fc44-amd64/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compat-decoy
          path: ${{ runner.temp }}/artifact-fixtures/compat-decoy/
          if-no-files-found: error

  sbom-download:
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-input
      - name: Verify the SBOM consumer's exact directories, files and bytes
        run: python3 scripts/check-artifact-download.py check-sbom release-input
      - name: Create deterministic SBOM fixtures
        run: python3 scripts/check-artifact-download.py create-sbom "$RUNNER_TEMP/artifact-sbom-fixtures"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: ${{ runner.temp }}/artifact-sbom-fixtures/release-sbom/
          if-no-files-found: error

  draft-download:
    needs: sbom-download
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-input
      - name: Verify the draft consumer's complete fixture set and bytes
        run: python3 scripts/check-artifact-download.py check-draft release-input
